# Typecheck, lint, build and the unit suites on every push and pull request. No signing and no release here:
# releases are built and signed on a Mac with `npm run dist`.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run audit
      - name: unit suites
        run: |
          for f in unit.mjs platform-unit.mjs unit-3a.mjs livefolders-unit.mjs; do
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON "tests/$f"
          done
